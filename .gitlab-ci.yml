stages: [test, build]

variables:
  IMAGE_NAME: $CI_REGISTRY_IMAGE/app

test:
  stage: test
  image: node:22-alpine
  script:
    - npm ci --ignore-scripts
    - npm run typecheck
    - npm test
    - npm run build

build-kaniko:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  needs: [test]
  script:
    - pwd && ls -lah
    - mkdir -p /kaniko/.docker
    - |
      cat > /kaniko/.docker/config.json <<EOF
      { "auths": { "${CI_REGISTRY}": { "username": "gitlab-ci-token", "password": "${CI_JOB_TOKEN}" } } }
      EOF
    - |
      EXTRA_DEST=""
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        EXTRA_DEST="--destination ${IMAGE_NAME}:latest"
      fi
      if [ -n "$CI_COMMIT_TAG" ]; then
        EXTRA_DEST="$EXTRA_DEST --destination ${IMAGE_NAME}:${CI_COMMIT_TAG}"
      fi
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}" \
        --dockerfile "${CI_PROJECT_DIR}/Dockerfile" \
        --custom-platform linux/amd64 \
        --push-retry "3" \
        --destination "${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}" \
        $EXTRA_DEST
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
